<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mimo: Lesson 5 | Gallery</title>
        <link rel="icon" type="image/png" alt="odin-logo" href="https://www.seekpng.com/png/detail/827-8273708_odin-project.png">
        <link rel="stylesheet" type="text/css" href="/Lesson-5-FlexBox/assets/css/style.css">
    </head>
    <body>
        <div class="container">
            <div class="content">
                <div class="gallery-header">
                    <h1>Cat Gallery</h1>
                </div>
                <div class="gallery-content">
                    <figure>
                        <img src="Lesson-5-Flexbox/assets/images/bongo.jpg" alt="bongo the cat" />
                        <figcaption>Bongo the Cat</figcaption>
                    </figure>
                    <figure>
                        <img src="Lesson-5-Flexbox/assets/images/leon.jpg" alt="leon the strong" />
                        <figcaption>Leon the Strong</figcaption>
                    </figure>
                    <figure>
                        <img src="Lesson-5-Flexbox/assets/images/whiskas.jpg" alt="whiskas the model" />
                        <figcaption>Whiskas the Model</figcaption>
                    </figure>    
                </div>
                <div class="modal">
                    <span class="close-btn">&times;</span>
                    <img class="modal-img" />
                </div>
            </div>
        </div>
    </body>
    <script src="/Lesson-5-FlexBox/assets/js/script.js"></script>
</html>
