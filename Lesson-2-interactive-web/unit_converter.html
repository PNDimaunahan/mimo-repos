<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mimo: Lesson 2 | Unit Converter</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Unit Converter</h1>
            <input id="inputUnit" class="form-control" type="number" placeholder="Enter Value...">
            <select id="unitOptions" class="form-control">
                <option value="toKilometers">Miles to kilometers</option>
                <option value="toMiles">kilometers to Miles</option>
            </select>
            <button id="button" class="form-control" type="submit">Convert</button>
            <p id="result" class="border">Result:</p>
        </div>
    </body>
    <script src="script.js"></script>
</html>
