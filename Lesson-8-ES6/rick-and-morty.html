<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mimo: Lesson 8 | Rick and Morty</title>
        <link rel="icon" type="image/png" alt="odin-logo" href="https://www.seekpng.com/png/detail/827-8273708_odin-project.png">
        <link rel="stylesheet" type="text/css" href="/Lesson-8-ES6/assets/css/style.css">
    </head>
    <body>
        <main>
            <div class="container">
                <img class="header-logo" src="/Lesson-8-ES6/assets/images/Rick_and_Morty.png">
                <div class="card-container"></div>
            </div>
            <div class="modal" id="character-modal">
                <div class="modal-content">
                    <button class="modal-close">&times;</button>

                    <div class="modal-image">
                        <img src="" alt="" />
                    </div>
                    <hr class="details-divider-upward">
                    <div class="character-content">
                        <div class="character-top">
                            <h2 class="character-title-modal"></h2>
                            <span class="character-type"></span>
                            <span class="character-status"></span>
                        </div>

                        <div class="details-row">
                            <div class="character-details-label">Gender:</div>
                            <div class="character-details-value gender"></div>
                        </div>
                        <hr class="details-divider">
                        <div class="details-column">
                            <div class="character-details-label">Origin:</div>
                            <div class="character-details-value origin"></div>

                            <div class="character-details-label">Last Known Location:</div>
                            <div class="character-details-value last-location"></div>
                        </div>
                        <hr class="details-divider">
                        <div class="character-episodes">
                            <h4>Episodes Appeared:</h4>
                            <div class="episodes-buttons"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
    <script src="/Lesson-8-ES6/assets/js/script.js"></script>
</html>
