<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mimo: Lesson 3 | Coffee Shop Menu</title>
        <link rel="icon" type="image/png" alt="odin-logo" href="https://www.seekpng.com/png/detail/827-8273708_odin-project.png">
        <link rel="stylesheet" type="text/css" href="/Lesson-3-HTML-CSS/assets/css/style.css">
    </head>
    <body>
        <div class="container">
            <div class="content">
                <h1>Coffee Shop Menu</h1>
                <p>Try our coffee blends and snacks!<br> Only yes the best!</p>
            </div>
            <div class="cards">
                <h3>--Basic Coffee--</h3>
                <div class="cards-content">
                    <ul class="menu-list">
                        <li><span>Espresso</span><span>21</span></li>
                        <li><span>Latte</span><span>22</span></li>
                        <li><span>Cappuccino</span><span>23</span></li>
                        <li><span>Macchiato</span><span>24</span></li>
                        <li><span>Americano</span><span>25</span></li>
                    </ul>
                    <img class="content-image" src="assets/images/espresso.webp" alt="expresso" />
                </div>
            </div>
        </div>
    </body>
    <script src="/Lesson-3-HTML-CSS/assets/js/script.js"></script>
</html>
