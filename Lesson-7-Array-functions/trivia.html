<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Mimo: Lesson 7 | Trivia Game</title>
        <link rel="icon" type="image/png" alt="odin-logo" href="https://www.seekpng.com/png/detail/827-8273708_odin-project.png">
        <link rel="stylesheet" type="text/css" href="/Lesson-7-Array-functions/assets/css/style.css">
    </head>
    <body>
        <main>
            <div class="container">
                <div class="content">
                    <div class="trivia-header">
                        <h1>Trivia Game</h1>
                        <p>Answer the following questions and win... Nothing!</p>
                    </div>
                    <div class="trivia-content">
                        <div class="trivia-question">
                            <h3>This will take 1-3mins of your time</h3>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="alert"></div>
                        <div class="trivia-button">
                            <button class="start-button">Start Questionaire</button>
                        </div>
                        <div class="trivia-options" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </main>
    </body>
    <script src="/Lesson-7-Array-functions/assets/js/script.js"></script>
</html>
